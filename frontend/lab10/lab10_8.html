<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Куб: Об'єм та Площа (ООП Стиль)</title>
        <style>
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background-color: #f0f2f5;
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }
            .container {
                background: white;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
                max-width: 400px;
                width: 100%;
                box-sizing: border-box;
            }
            h2 {
                color: #2c3e50;
                margin-top: 0;
                text-align: center;
                border-bottom: 2px solid #3498db;
                padding-bottom: 10px;
            }
            .form-group {
                margin-bottom: 15px;
            }
            label {
                display: block;
                font-weight: 600;
                margin-bottom: 5px;
                color: #34495e;
            }
            input[type="number"],
            input[type="text"] {
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 6px;
                box-sizing: border-box;
                font-size: 16px;
            }
            input:focus {
                border-color: #3498db;
                outline: none;
                box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
            }
            .checkbox-group {
                background: #f8f9fa;
                padding: 12px;
                border-radius: 6px;
                border: 1px solid #e2e8f0;
                margin-bottom: 15px;
            }
            .checkbox-item {
                display: flex;
                align-items: center;
                margin-bottom: 8px;
                cursor: pointer;
            }
            .checkbox-item:last-child {
                margin-bottom: 0;
            }
            .checkbox-item input {
                margin-right: 10px;
                transform: scale(1.2);
                cursor: pointer;
            }
            .error {
                color: #e74c3c;
                font-size: 14px;
                font-weight: bold;
                margin-top: 5px;
                display: none;
            }
            .btn-reset {
                width: 100%;
                background-color: #95a5a6;
                color: white;
                border: none;
                padding: 12px;
                border-radius: 6px;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
                transition: background 0.2s;
                margin-top: 10px;
            }
            .btn-reset:hover {
                background-color: #7f8c8d;
            }
            .result-field {
                background-color: #f8f9fa;
                font-weight: bold;
                color: #2c3e50;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h2>Розрахунок куба (ООП)</h2>

            <form id="cubeForm">
                <div class="form-group">
                    <label for="side">Сторона куба (а):</label>
                    <input
                        type="number"
                        id="side"
                        step="any"
                        placeholder="Введіть довжину сторони"
                    />
                    <div id="error-msg" class="error">
                        Помилка: Сторона куба повинна бути додатним числом!
                    </div>
                </div>

                <div class="checkbox-group">
                    <label>Оберіть розрахункові параметри:</label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="calcVolume" value="volume" />
                        Розрахувати об'єм (V)
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="calcArea" value="area" />
                        Розрахувати площу поверхні (S)
                    </label>
                </div>

                <div class="form-group">
                    <label for="volumeResult">Об'єм куба (V):</label>
                    <input
                        type="text"
                        id="volumeResult"
                        class="result-field"
                        readonly
                        placeholder="---"
                    />
                </div>

                <div class="form-group">
                    <label for="areaResult">Площа поверхні (S):</label>
                    <input
                        type="text"
                        id="areaResult"
                        class="result-field"
                        readonly
                        placeholder="---"
                    />
                </div>

                <button type="reset" class="btn-reset" id="resetBtn">
                    Очистити форму
                </button>
            </form>
        </div>

        <script>
            // =========================================================
            // КЛАС ДЛЯ ОБЧИСЛЕННЯ ТА КЕРУВАННЯ КОМПОНЕНТАМИ ИНТЕРФЕЙСУ
            // =========================================================
            class CubeCalculator {
                constructor() {
                    // Ініціалізація властивостей об'єкта (DOM елементи)
                    this.sideInput = document.getElementById("side");
                    this.calcVolumeChk = document.getElementById("calcVolume");
                    this.calcAreaChk = document.getElementById("calcArea");
                    this.volumeResult = document.getElementById("volumeResult");
                    this.areaResult = document.getElementById("areaResult");
                    this.errorMsg = document.getElementById("error-msg");
                    this.form = document.getElementById("cubeForm");
                }

                // Метод для зчитування значення сторони
                getSideValue() {
                    return parseFloat(this.sideInput.value);
                }

                // Метод валідації введених даних
                validate(side) {
                    if (this.sideInput.value.trim() !== "") {
                        if (isNaN(side) || side <= 0) {
                            this.showError(true);
                            return false;
                        }
                    }
                    this.showError(false);
                    return true;
                }

                // Метод керування відображенням помилки
                showError(isError) {
                    if (isError) {
                        this.errorMsg.style.display = "block";
                        this.volumeResult.value = "Помилка";
                        this.areaResult.value = "Помилка";
                    } else {
                        this.errorMsg.style.display = "none";
                    }
                }

                // Метод для розрахунку та виведення результатів
                processCalculation() {
                    const side = this.getSideValue();

                    // Якщо валідація не пройдена, перериваємо обчислення
                    if (!this.validate(side)) return;

                    const isDataValid = !isNaN(side) && side > 0;

                    // Логіка розрахунку та виводу Об'єму
                    if (this.calcVolumeChk.checked && isDataValid) {
                        const volume = Math.pow(side, 3);
                        this.volumeResult.value = volume.toFixed(4);
                    } else {
                        this.volumeResult.value = "---";
                    }

                    // Логіка розрахунку та виводу Площі
                    if (this.calcAreaChk.checked && isDataValid) {
                        const area = 6 * Math.pow(side, 2);
                        this.areaResult.value = area.toFixed(4);
                    } else {
                        this.areaResult.value = "---";
                    }
                }

                // Метод для скидання стану форми до початкового
                resetFields() {
                    this.errorMsg.style.display = "none";
                    this.volumeResult.value = "---";
                    this.areaResult.value = "---";
                }

                // Метод прив'язки контексту "this" та слухачів подій (Events)
                initEvents() {
                    // Використовуємо .bind(this) щоб всередині методів "this" залишався об'єктом класу CubeCalculator
                    const handler = this.processCalculation.bind(this);

                    this.sideInput.addEventListener("input", handler);
                    this.calcVolumeChk.addEventListener("change", handler);
                    this.calcAreaChk.addEventListener("change", handler);

                    this.form.addEventListener(
                        "reset",
                        this.resetFields.bind(this),
                    );
                }
            }

            // =========================================================
            // СТВОРЕННЯ ОБ'ЄКТА ТА ВИКЛИК ЙОГО МЕТОДІВ
            // =========================================================
            document.addEventListener("DOMContentLoaded", function () {
                // Створення екземпляру класу
                const calculator = new CubeCalculator();
                // Активація відслідковування подій
                calculator.initEvents();
            });
        </script>
    </body>
</html>
