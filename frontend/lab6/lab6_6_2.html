<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Flexbox Layout Staircase</title>
        <style>
            body {
                margin: 0;
                height: 100vh;
                display: flex;

                justify-content: space-around;

                align-items: center;
                padding: 20px;
                box-sizing: border-box;
                background-color: #fff;
            }

            .group {
                display: flex;
                gap: 10px;
            }

            .block {
                width: 60px;
                height: 60px;
                border: 2px solid #000;
                background-color: #fff;
            }

            .group-left {
                align-self: flex-end;
                margin-bottom: 15vh;
            }

            .group-center {
                align-self: center;
                margin-bottom: 10vh;
            }

            .group-right {
                align-self: flex-start;
                margin-top: 15vh;
            }
        </style>
    </head>
    <body>
        <div class="group group-left">
            <div class="block"></div>
            <div class="block"></div>
            <div class="block"></div>
        </div>

        <div class="group group-center">
            <div class="block"></div>
            <div class="block"></div>
            <div class="block"></div>
        </div>

        <div class="group group-right">
            <div class="block"></div>
            <div class="block"></div>
            <div class="block"></div>
        </div>
    </body>
</html>
