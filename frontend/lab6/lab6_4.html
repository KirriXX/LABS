<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Flexbox Макет сторінки</title>
        <style>
            body {
                margin: 0;
                display: flex;
                height: 100vh;
                font-family: sans-serif;
                font-weight: medium;
                font-size: 24px;
            }

            .nav {
                background-color: yellow;
                color: brown;
                padding: 20px;

                flex: 0 0 30%;

                display: flex;
                flex-direction: column;
            }

            .right-wrapper {
                flex-grow: 1;

                display: flex;
                flex-direction: column;
            }

            .header {
                background-color: #e91e63;
                color: #ffeb3b;
                padding: 20px;

                flex: 0 0 80px;

                display: flex;
                align-items: flex-start;
            }

            .content {
                background-color: #2196f3;
                color: white;
                padding: 20px;

                flex-grow: 1;
            }

            .footer {
                background-color: #9c27b0;
                color: yellow;
                padding: 20px;

                flex: 0 0 60px;

                display: flex;
                align-items: flex-start;
            }
        </style>
    </head>
    <body>
        <nav class="nav">Nav</nav>

        <div class="right-wrapper">
            <header class="header">Header</header>
            <main class="content">Content</main>
            <footer class="footer">Footer</footer>
        </div>
    </body>
</html>
