<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Перевірка та керування масивом — Варіант 7</title>
        <style>
            body {
                font-family: "Segoe UI", Arial, sans-serif;
                background-color: #f4f6f9;
                padding: 30px;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }
            .card {
                background: white;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
                max-width: 550px;
                width: 100%;
                box-sizing: border-box;
            }
            h2 {
                color: #2c3e50;
                margin-top: 0;
                margin-bottom: 20px;
                font-size: 22px;
                border-bottom: 2px solid #3498db;
                padding-bottom: 10px;
                text-align: center;
            }
            .form-group {
                margin-bottom: 15px;
            }
            label {
                display: block;
                font-weight: 600;
                margin-bottom: 6px;
                color: #34495e;
                font-size: 14px;
            }
            input[type="number"],
            select {
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 6px;
                box-sizing: border-box;
                font-size: 16px;
                background-color: white;
            }
            .btn-main {
                background-color: #3498db;
                color: white;
                font-size: 16px;
                font-weight: bold;
                padding: 12px 24px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                transition: background-color 0.2s;
                width: 100%;
                margin-bottom: 20px;
            }
            .btn-main:hover {
                background-color: #2980b9;
            }
            .operations-panel {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
                margin-top: 15px;
                margin-bottom: 15px;
            }
            .btn-op {
                color: white;
                font-size: 14px;
                font-weight: bold;
                padding: 10px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                transition: background-color 0.2s;
            }
            .btn-add {
                background-color: #2ecc71;
            }
            .btn-add:hover:not(:disabled) {
                background-color: #27ae60;
            }
            .btn-remove {
                background-color: #e74c3c;
            }
            .btn-remove:hover:not(:disabled) {
                background-color: #c0392b;
            }
            .btn-replace {
                background-color: #f39c12;
            }
            .btn-replace:hover:not(:disabled) {
                background-color: #d35400;
            }
            .btn-sort {
                background-color: #9b59b6;
            }
            .btn-sort:hover:not(:disabled) {
                background-color: #8e44ad;
            }
            .btn-copy {
                background-color: #16a085;
            }
            .btn-copy:hover:not(:disabled) {
                background-color: #1abc9c;
            }
            .btn-filter {
                background-color: #34495e;
            }
            .btn-filter:hover:not(:disabled) {
                background-color: #2c3e50;
            }
            .btn-stats {
                background-color: #d35400;
            }
            .btn-stats:hover:not(:disabled) {
                background-color: #e67e22;
            }
            .btn-modify {
                background-color: #7f8c8d;
            }
            .btn-modify:hover:not(:disabled) {
                background-color: #95a5a6;
            }

            /* Нова кнопка Перевірити */
            .btn-check {
                background-color: #d14949;
                grid-column: span 3;
            }
            .btn-check:hover:not(:disabled) {
                background-color: #b83232;
            }

            .btn-op:disabled,
            select:disabled {
                background-color: #bdc3c7;
                cursor: not-allowed;
            }
            .result-block {
                margin-top: 15px;
                padding: 15px;
                background-color: #f8f9fa;
                border: 1px dashed #3498db;
                border-radius: 6px;
                word-wrap: break-word;
            }
            .copy-block {
                border-color: #16a085;
                background-color: #f0fdfa;
            }
            .filter-block {
                border-color: #2c3e50;
                background-color: #f1f5f9;
            }
            .stats-block {
                border-color: #d35400;
                background-color: #fffaf0;
            }
            .modify-block {
                border-color: #7f8c8d;
                background-color: #fbfcfc;
            }
            .check-block {
                border-color: #d14949;
                background-color: #fff5f5;
            }

            .array-meta {
                font-weight: bold;
                color: #2c3e50;
                margin-bottom: 8px;
            }
            .array-content {
                font-family: "Courier New", Courier, monospace;
                font-size: 16px;
                color: #27ae60;
                letter-spacing: 1px;
            }
            .copy-block .array-content {
                color: #0e7490;
            }
            .filter-block .array-content {
                color: #475569;
            }
            .modify-block .array-content {
                color: #34495e;
            }
            .stats-block .stats-content {
                font-size: 18px;
                font-weight: bold;
                color: #c0392b;
            }

            .check-content {
                font-size: 15px;
                color: #2c3e50;
                line-height: 1.5;
            }
            .check-status {
                font-weight: bold;
            }
            .status-true {
                color: #27ae60;
            }
            .status-false {
                color: #e74c3c;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h2>Перевірка елементів масиву (Варіант 7)</h2>

            <form onsubmit="event.preventDefault()">
                <button type="button" id="generateBtn" class="btn-main">
                    Створити масив
                </button>

                <div class="form-group">
                    <label for="indexInput"
                        >Вкажіть номер (індекс елемента від 0):</label
                    >
                    <input
                        type="number"
                        id="indexInput"
                        min="0"
                        placeholder="Наприклад: 0, 1, 2..."
                        disabled
                    />
                </div>

                <div class="form-group">
                    <label for="sortOrderSelect"
                        >Напрямок сортування (усього масиву):</label
                    >
                    <select id="sortOrderSelect" disabled>
                        <option value="asc">За зростанням</option>
                        <option value="desc">За зменшенням</option>
                    </select>
                </div>

                <div class="operations-panel">
                    <button
                        type="button"
                        id="addBtn"
                        class="btn-op btn-add"
                        disabled
                    >
                        Додати
                    </button>
                    <button
                        type="button"
                        id="removeBtn"
                        class="btn-op btn-remove"
                        disabled
                    >
                        Видалити
                    </button>
                    <button
                        type="button"
                        id="replaceBtn"
                        class="btn-op btn-replace"
                        disabled
                    >
                        Замінити
                    </button>

                    <button
                        type="button"
                        id="sortBtn"
                        class="btn-op btn-sort"
                        disabled
                    >
                        Сортувати
                    </button>
                    <button
                        type="button"
                        id="copyBtn"
                        class="btn-op btn-copy"
                        disabled
                    >
                        Копіювати
                    </button>
                    <button
                        type="button"
                        id="filterBtn"
                        class="btn-op btn-filter"
                        disabled
                    >
                        Фільтрувати
                    </button>
                    <button
                        type="button"
                        id="statsBtn"
                        class="btn-op btn-stats"
                        disabled
                    >
                        Статистика
                    </button>
                    <button
                        type="button"
                        id="modifyBtn"
                        class="btn-op btn-modify"
                        disabled
                    >
                        Модифікація
                    </button>

                    <button
                        type="button"
                        id="checkBtn"
                        class="btn-op btn-check"
                        disabled
                    >
                        Перевірити
                    </button>
                </div>
            </form>

            <div class="result-block" id="resultBlock" style="display: none">
                <div class="array-meta" id="arrayMeta"></div>
                <div class="array-content" id="arrayContent"></div>
            </div>

            <div
                class="result-block copy-block"
                id="copyResultBlock"
                style="display: none"
            >
                <div class="array-meta" style="color: #115e59">
                    Скопійований масив (Варіант 7):
                </div>
                <div class="array-content" id="copyArrayContent"></div>
            </div>

            <div
                class="result-block filter-block"
                id="filterResultBlock"
                style="display: none"
            >
                <div class="array-meta" style="color: #1e293b">
                    Відфільтрований масив (Елементи &lt; 5):
                </div>
                <div class="array-content" id="filterArrayContent"></div>
            </div>

            <div
                class="result-block stats-block"
                id="statsResultBlock"
                style="display: none"
            >
                <div class="array-meta" style="color: #a04000">
                    Статистичні розрахунки (Варіант 7):
                </div>
                <div class="stats-content" id="statsContent"></div>
            </div>

            <div
                class="result-block modify-block"
                id="modifyResultBlock"
                style="display: none"
            >
                <div class="array-meta" style="color: #4f5b66">
                    Модифікований масив (Усі елементи збільшено втричі):
                </div>
                <div class="array-content" id="modifyArrayContent"></div>
            </div>

            <div
                class="result-block check-block"
                id="checkResultBlock"
                style="display: none"
            >
                <div class="array-meta" style="color: #922b21">
                    Результати перевірки (Варіант 7):
                </div>
                <div class="check-content" id="checkContent"></div>
            </div>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const generateBtn = document.getElementById("generateBtn");
                const indexInput = document.getElementById("indexInput");
                const sortOrderSelect =
                    document.getElementById("sortOrderSelect");
                const addBtn = document.getElementById("addBtn");
                const removeBtn = document.getElementById("removeBtn");
                const replaceBtn = document.getElementById("replaceBtn");
                const sortBtn = document.getElementById("sortBtn");
                const copyBtn = document.getElementById("copyBtn");
                const filterBtn = document.getElementById("filterBtn");
                const statsBtn = document.getElementById("statsBtn");
                const modifyBtn = document.getElementById("modifyBtn");
                const checkBtn = document.getElementById("checkBtn");

                const resultBlock = document.getElementById("resultBlock");
                const arrayMeta = document.getElementById("arrayMeta");
                const arrayContent = document.getElementById("arrayContent");

                const copyResultBlock =
                    document.getElementById("copyResultBlock");
                const copyArrayContent =
                    document.getElementById("copyArrayContent");

                const filterResultBlock =
                    document.getElementById("filterResultBlock");
                const filterArrayContent =
                    document.getElementById("filterArrayContent");

                const statsResultBlock =
                    document.getElementById("statsResultBlock");
                const statsContent = document.getElementById("statsContent");

                const modifyResultBlock =
                    document.getElementById("modifyResultBlock");
                const modifyArrayContent =
                    document.getElementById("modifyArrayContent");

                const checkResultBlock =
                    document.getElementById("checkResultBlock");
                const checkContent = document.getElementById("checkContent");

                let numbersArray = [];

                // За умовами Варіанту 7: Діапазон значень від 20 до 80
                function getRandomValue() {
                    return Math.floor(Math.random() * (80 - 20 + 1)) + 20;
                }

                function updateDisplay() {
                    if (numbersArray.length === 0) {
                        arrayMeta.textContent = "Масив порожній.";
                        arrayContent.textContent = "[]";
                        toggleOperationControls(false);
                        copyResultBlock.style.display = "none";
                        filterResultBlock.style.display = "none";
                        statsResultBlock.style.display = "none";
                        modifyResultBlock.style.display = "none";
                        checkResultBlock.style.display = "none";
                    } else {
                        arrayMeta.textContent = `Кількість елементів: ${numbersArray.length}`;
                        arrayContent.textContent = `[ ${numbersArray.join(", ")} ]`;
                    }
                }

                function toggleOperationControls(enable) {
                    indexInput.disabled = !enable;
                    sortOrderSelect.disabled = !enable;
                    addBtn.disabled = !enable;
                    removeBtn.disabled = !enable;
                    replaceBtn.disabled = !enable;
                    sortBtn.disabled = !enable;
                    copyBtn.disabled = !enable;
                    filterBtn.disabled = !enable;
                    statsBtn.disabled = !enable;
                    modifyBtn.disabled = !enable;
                    checkBtn.disabled = !enable;
                }

                // 1. Створення масиву (Варіант 7: від 15 до 40 елементів)
                generateBtn.addEventListener("click", function () {
                    const count =
                        Math.floor(Math.random() * (40 - 15 + 1)) + 15;
                    numbersArray = [];

                    for (let i = 0; i < count; i++) {
                        numbersArray.push(getRandomValue());
                    }

                    resultBlock.style.display = "block";
                    copyResultBlock.style.display = "none";
                    filterResultBlock.style.display = "none";
                    statsResultBlock.style.display = "none";
                    modifyResultBlock.style.display = "none";
                    checkResultBlock.style.display = "none";
                    updateDisplay();
                    toggleOperationControls(true);
                    indexInput.max = numbersArray.length - 1;
                    indexInput.value = 0;
                });

                // 2. Додання випадкового елемента після вказаного індексу
                addBtn.addEventListener("click", function () {
                    const idx = parseInt(indexInput.value, 10);
                    if (isNaN(idx) || idx < 0 || idx >= numbersArray.length) {
                        alert(
                            `Будь ласка, введіть коректний індекс від 0 до ${numbersArray.length - 1}`,
                        );
                        return;
                    }
                    numbersArray.splice(idx + 1, 0, getRandomValue());
                    updateDisplay();
                    indexInput.max = numbersArray.length - 1;
                });

                // 3. Видалення з кінця масиву
                removeBtn.addEventListener("click", function () {
                    if (numbersArray.length > 0) {
                        numbersArray.pop();
                        updateDisplay();
                        if (numbersArray.length > 0) {
                            indexInput.max = numbersArray.length - 1;
                        }
                    }
                });

                // 4. Заміна елемента за вказаним номером (Можна ввести від'ємне число для перевірки)
                replaceBtn.addEventListener("click", function () {
                    const idx = parseInt(indexInput.value, 10);
                    if (isNaN(idx) || idx < 0 || idx >= numbersArray.length) {
                        alert(
                            `Будь ласка, введіть коректний індекс від 0 до ${numbersArray.length - 1}`,
                        );
                        return;
                    }
                    // Даємо можливість ввести власне значення через prompt (наприклад, негативне)
                    const userVal = prompt(
                        "Введіть нове число для заміни:",
                        getRandomValue(),
                    );
                    if (userVal !== null && !isNaN(parseInt(userVal, 10))) {
                        numbersArray[idx] = parseInt(userVal, 10);
                        updateDisplay();
                    }
                });

                // 5. Сортування
                sortBtn.addEventListener("click", function () {
                    if (numbersArray.length === 0) return;
                    const order = sortOrderSelect.value;
                    if (order === "asc") {
                        numbersArray.sort((a, b) => a - b);
                    } else if (order === "desc") {
                        numbersArray.sort((a, b) => b - a);
                    }
                    updateDisplay();
                });

                // 6. Копіювання
                copyBtn.addEventListener("click", function () {
                    if (numbersArray.length === 0) return;
                    const mid = Math.floor(numbersArray.length / 2);
                    const half1 = numbersArray.slice(0, mid).reverse();
                    const half2 = numbersArray.slice(mid).reverse();
                    const copiedArray = half2.concat(half1);

                    copyArrayContent.textContent = `[ ${copiedArray.join(", ")} ]`;
                    copyResultBlock.style.display = "block";
                });

                // 7. Фільтрація
                filterBtn.addEventListener("click", function () {
                    if (numbersArray.length === 0) return;
                    const filteredArray = numbersArray.filter((num) => num < 5);
                    filterArrayContent.textContent = `[ ${filteredArray.join(", ")} ]`;
                    filterResultBlock.style.display = "block";
                });

                // 8. Статистика
                statsBtn.addEventListener("click", function () {
                    if (numbersArray.length === 0) return;
                    const evenSum = numbersArray.reduce(function (
                        accumulator,
                        current,
                    ) {
                        if (current % 2 === 0) {
                            return accumulator + current;
                        }
                        return accumulator;
                    }, 0);

                    statsContent.textContent = `Сума парних елементів = ${evenSum}`;
                    statsResultBlock.style.display = "block";
                });

                // 9. Модифікація
                modifyBtn.addEventListener("click", function () {
                    if (numbersArray.length === 0) return;
                    const modifiedArray = numbersArray.reduce(function (
                        accumulator,
                        current,
                    ) {
                        accumulator.push(current * 3);
                        return accumulator;
                    }, []);

                    modifyArrayContent.textContent = `[ ${modifiedArray.join(", ")} ]`;
                    modifyResultBlock.style.display = "block";
                });

                // 10. МОДИФІКАЦІЯ: Перевірка усього масиву за допомогою методів every() та some() (Варіант 7)
                checkBtn.addEventListener("click", function () {
                    if (numbersArray.length === 0) return;

                    // 1. Чи УСІ елементи негативні (менші за 0)
                    const allNegative = numbersArray.every(function (num) {
                        return num < 0;
                    });

                    // 2. Чи ХОЧА Б ОДИН елемент негативний (менший за 0)
                    const someNegative = numbersArray.some(function (num) {
                        return num < 0;
                    });

                    // Формування результату для виведення на екран
                    checkContent.innerHTML = `
                        1. Усі елементи масиву негативні?
                        <span class="check-status ${allNegative ? "status-true" : "status-false"}">
                            ${allNegative ? "ТАК (true)" : "НІ (false)"}
                        </span><br>
                        2. Хоча б один елемент негативний?
                        <span class="check-status ${someNegative ? "status-true" : "status-false"}">
                            ${someNegative ? "ТАК (true)" : "НІ (false)"}
                        </span>
                    `;
                    checkResultBlock.style.display = "block";
                });
            });
        </script>
    </body>
</html>
