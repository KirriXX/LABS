<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Генератор масиву — Варіант 7</title>
        <style>
            body {
                font-family: "Segoe UI", Arial, sans-serif;
                background-color: #f4f6f9;
                padding: 30px;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 80vh;
            }
            .card {
                background: white;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
                max-width: 500px;
                width: 100%;
                box-sizing: border-box;
                text-align: center;
            }
            h2 {
                color: #2c3e50;
                margin-top: 0;
                margin-bottom: 20px;
                font-size: 22px;
                border-bottom: 2px solid #3498db;
                padding-bottom: 10px;
            }
            .info-box {
                background-color: #ecf0f1;
                padding: 10px;
                border-radius: 6px;
                font-size: 14px;
                color: #7f8c8d;
                margin-bottom: 20px;
                text-align: left;
            }
            .btn {
                background-color: #3498db;
                color: white;
                font-size: 16px;
                font-weight: bold;
                padding: 12px 24px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                transition: background-color 0.2s;
                width: 100%;
            }
            .btn:hover {
                background-color: #2980b9;
            }
            .result-block {
                margin-top: 25px;
                padding: 15px;
                background-color: #f8f9fa;
                border: 1px dashed #3498db;
                border-radius: 6px;
                min-height: 50px;
                word-wrap: break-word;
                text-align: left;
            }
            .array-meta {
                font-weight: bold;
                color: #2c3e50;
                margin-bottom: 8px;
            }
            .array-content {
                font-family: "Courier New", Courier, monospace;
                font-size: 16px;
                color: #27ae60;
                letter-spacing: 1px;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h2>Генератор випадкового масиву</h2>

            <div class="info-box">
                <strong>Параметри Варіанту №7:</strong><br />
                • Кількість елементів: від 15 до 40<br />
                • Діапазон цілих чисел: від 20 до 80
            </div>

            <form onsubmit="event.preventDefault()">
                <button type="button" id="generateBtn" class="btn">
                    Створити масив
                </button>
            </form>

            <div class="result-block" id="resultBlock" style="display: none">
                <div class="array-meta" id="arrayMeta"></div>
                <div class="array-content" id="arrayContent"></div>
            </div>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const generateBtn = document.getElementById("generateBtn");
                const resultBlock = document.getElementById("resultBlock");
                const arrayMeta = document.getElementById("arrayMeta");
                const arrayContent = document.getElementById("arrayContent");

                generateBtn.addEventListener("click", function () {
                    // 1. Генерація випадкової кількості елементів від 15 до 40 включно
                    // Формула: Math.floor(Math.random() * (max - min + 1)) + min
                    const count =
                        Math.floor(Math.random() * (40 - 15 + 1)) + 15;

                    // Ініціалізація порожнього масиву
                    const numbersArray = [];

                    // 2. Заповнення масиву випадковими цілими числами від 20 до 80 включно
                    for (let i = 0; i < count; i++) {
                        const randomNum =
                            Math.floor(Math.random() * (80 - 20 + 1)) + 20;
                        numbersArray.push(randomNum); // Додаємо елемент в кінець масиву
                    }

                    // 3. Відображення результату на сторінці
                    arrayMeta.textContent = `Згенеровано елементів: ${count}`;
                    // Перетворюємо масив на рядок із комами та пробілами для кращого вигляду
                    arrayContent.textContent = `[ ${numbersArray.join(", ")} ]`;

                    // Робимо блок результату видимим
                    resultBlock.style.display = "block";
                });
            });
        </script>
    </body>
</html>
