<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Сортування та керування масивом — Варіант 7</title>
        <style>
            body {
                font-family: "Segoe UI", Arial, sans-serif;
                background-color: #f4f6f9;
                padding: 30px;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 95vh;
            }
            .card {
                background: white;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
                max-width: 550px;
                width: 100%;
                box-sizing: border-box;
            }
            h2 {
                color: #2c3e50;
                margin-top: 0;
                margin-bottom: 20px;
                font-size: 22px;
                border-bottom: 2px solid #3498db;
                padding-bottom: 10px;
                text-align: center;
            }
            .form-group {
                margin-bottom: 15px;
            }
            label {
                display: block;
                font-weight: 600;
                margin-bottom: 6px;
                color: #34495e;
                font-size: 14px;
            }
            input[type="number"],
            select {
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 6px;
                box-sizing: border-box;
                font-size: 16px;
                background-color: white;
            }
            .btn-main {
                background-color: #3498db;
                color: white;
                font-size: 16px;
                font-weight: bold;
                padding: 12px 24px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                transition: background-color 0.2s;
                width: 100%;
                margin-bottom: 20px;
            }
            .btn-main:hover {
                background-color: #2980b9;
            }
            .operations-panel {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
                margin-top: 15px;
                margin-bottom: 15px;
            }
            .btn-op {
                color: white;
                font-size: 14px;
                font-weight: bold;
                padding: 10px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                transition: background-color 0.2s;
            }
            .btn-add {
                background-color: #2ecc71;
            }
            .btn-add:hover:not(:disabled) {
                background-color: #27ae60;
            }
            .btn-remove {
                background-color: #e74c3c;
            }
            .btn-remove:hover:not(:disabled) {
                background-color: #c0392b;
            }
            .btn-replace {
                background-color: #f39c12;
            }
            .btn-replace:hover:not(:disabled) {
                background-color: #d35400;
            }

            /* Стиль для кнопки сортування */
            .btn-sort {
                background-color: #9b59b6;
                grid-column: span 3; /* Розтягуємо на всю ширину панелі */
            }
            .btn-sort:hover:not(:disabled) {
                background-color: #8e44ad;
            }

            .btn-op:disabled,
            select:disabled {
                background-color: #bdc3c7;
                cursor: not-allowed;
            }
            .result-block {
                margin-top: 25px;
                padding: 15px;
                background-color: #f8f9fa;
                border: 1px dashed #3498db;
                border-radius: 6px;
                min-height: 50px;
                word-wrap: break-word;
            }
            .array-meta {
                font-weight: bold;
                color: #2c3e50;
                margin-bottom: 8px;
            }
            .array-content {
                font-family: "Courier New", Courier, monospace;
                font-size: 16px;
                color: #27ae60;
                letter-spacing: 1px;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h2>Сортування масиву (Варіант 7)</h2>

            <form onsubmit="event.preventDefault()">
                <button type="button" id="generateBtn" class="btn-main">
                    Створити масив
                </button>

                <div class="form-group">
                    <label for="indexInput"
                        >Вкажіть номер (індекс елемента від 0):</label
                    >
                    <input
                        type="number"
                        id="indexInput"
                        min="0"
                        placeholder="Наприклад: 0, 1, 2..."
                        disabled
                    />
                </div>

                <div class="form-group">
                    <label for="sortOrderSelect"
                        >Напрямок сортування (усього масиву):</label
                    >
                    <select id="sortOrderSelect" disabled>
                        <option value="asc">За зростанням</option>
                        <option value="desc">За зменшенням</option>
                    </select>
                </div>

                <div class="operations-panel">
                    <button
                        type="button"
                        id="addBtn"
                        class="btn-op btn-add"
                        disabled
                    >
                        Додати
                    </button>
                    <button
                        type="button"
                        id="removeBtn"
                        class="btn-op btn-remove"
                        disabled
                    >
                        Видалити
                    </button>
                    <button
                        type="button"
                        id="replaceBtn"
                        class="btn-op btn-replace"
                        disabled
                    >
                        Замінити
                    </button>

                    <button
                        type="button"
                        id="sortBtn"
                        class="btn-op btn-sort"
                        disabled
                    >
                        Сортувати
                    </button>
                </div>
            </form>

            <div class="result-block" id="resultBlock" style="display: none">
                <div class="array-meta" id="arrayMeta"></div>
                <div class="array-content" id="arrayContent"></div>
            </div>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const generateBtn = document.getElementById("generateBtn");
                const indexInput = document.getElementById("indexInput");
                const sortOrderSelect =
                    document.getElementById("sortOrderSelect");
                const addBtn = document.getElementById("addBtn");
                const removeBtn = document.getElementById("removeBtn");
                const replaceBtn = document.getElementById("replaceBtn");
                const sortBtn = document.getElementById("sortBtn");
                const resultBlock = document.getElementById("resultBlock");
                const arrayMeta = document.getElementById("arrayMeta");
                const arrayContent = document.getElementById("arrayContent");

                let numbersArray = [];

                function getRandomValue() {
                    return Math.floor(Math.random() * (80 - 20 + 1)) + 20;
                }

                function updateDisplay() {
                    if (numbersArray.length === 0) {
                        arrayMeta.textContent = "Масив порожній.";
                        arrayContent.textContent = "[]";
                        toggleOperationControls(false);
                    } else {
                        arrayMeta.textContent = `Кількість елементів: ${numbersArray.length}`;
                        arrayContent.textContent = `[ ${numbersArray.join(", ")} ]`;
                    }
                }

                function toggleOperationControls(enable) {
                    indexInput.disabled = !enable;
                    sortOrderSelect.disabled = !enable;
                    addBtn.disabled = !enable;
                    removeBtn.disabled = !enable;
                    replaceBtn.disabled = !enable;
                    sortBtn.disabled = !enable;
                }

                // 1. Створення масиву
                generateBtn.addEventListener("click", function () {
                    const count =
                        Math.floor(Math.random() * (40 - 15 + 1)) + 15;
                    numbersArray = [];

                    for (let i = 0; i < count; i++) {
                        numbersArray.push(getRandomValue());
                    }

                    resultBlock.style.display = "block";
                    updateDisplay();
                    toggleOperationControls(true);
                    indexInput.max = numbersArray.length - 1;
                });

                // 2. Додання
                addBtn.addEventListener("click", function () {
                    const idx = parseInt(indexInput.value, 10);
                    if (isNaN(idx) || idx < 0 || idx >= numbersArray.length) {
                        alert(
                            `Будь ласка, введіть коректний індекс від 0 до ${numbersArray.length - 1}`,
                        );
                        return;
                    }
                    numbersArray.splice(idx + 1, 0, getRandomValue());
                    updateDisplay();
                    indexInput.max = numbersArray.length - 1;
                });

                // 3. Видалення з кінця
                removeBtn.addEventListener("click", function () {
                    if (numbersArray.length > 0) {
                        numbersArray.pop();
                        updateDisplay();
                        if (numbersArray.length > 0) {
                            indexInput.max = numbersArray.length - 1;
                        }
                    }
                });

                // 4. Заміна
                replaceBtn.addEventListener("click", function () {
                    const idx = parseInt(indexInput.value, 10);
                    if (isNaN(idx) || idx < 0 || idx >= numbersArray.length) {
                        alert(
                            `Будь ласка, введіть коректний індекс від 0 до ${numbersArray.length - 1}`,
                        );
                        return;
                    }
                    numbersArray[idx] = getRandomValue();
                    updateDisplay();
                });

                // 5. МОДИФІКАЦІЯ: Сортування всього масиву
                sortBtn.addEventListener("click", function () {
                    if (numbersArray.length === 0) return;

                    const order = sortOrderSelect.value; // Отримуємо вибране значення зі списку (asc або desc)

                    if (order === "asc") {
                        // Сортування за зростанням
                        numbersArray.sort(function (a, b) {
                            return a - b;
                        });
                    } else if (order === "desc") {
                        // Сортування за зменшенням
                        numbersArray.sort(function (a, b) {
                            return b - a;
                        });
                    }

                    updateDisplay();
                });
            });
        </script>
    </body>
</html>
