<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Динамічна таблиця тварин (Модифікована)</title>
        <style>
            body {
                font-family: "Segoe UI", Arial, sans-serif;
                background-color: #f4f6f9;
                padding: 30px;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                margin: 0;
            }
            .table-card {
                background: white;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
                max-width: 900px;
                width: 100%;
                box-sizing: border-box;
                margin-bottom: 20px;
            }
            h2 {
                color: #2c3e50;
                margin-top: 0;
                border-bottom: 2px solid #3498db;
                padding-bottom: 10px;
                font-size: 22px;
            }
            /* Сітка для 5 полів введення */
            .inputs-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 12px;
                margin-bottom: 20px;
            }
            .form-group {
                display: flex;
                flex-direction: column;
            }
            label {
                font-weight: 600;
                margin-bottom: 6px;
                color: #34495e;
                font-size: 14px;
            }
            input[type="text"],
            input[type="number"] {
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 6px;
                box-sizing: border-box;
                font-size: 14px;
            }
            input:focus {
                border-color: #3498db;
                outline: none;
                box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
            }
            .btn-container {
                display: flex;
                gap: 15px;
                margin-bottom: 25px;
                justify-content: center;
            }
            .btn {
                min-width: 150px;
                font-size: 16px;
                font-weight: bold;
                padding: 12px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                transition: background-color 0.2s;
                color: white;
            }
            .btn-add {
                background-color: #2ecc71;
            }
            .btn-add:hover {
                background-color: #27ae60;
            }
            .btn-remove {
                background-color: #e74c3c;
            }
            .btn-remove:hover {
                background-color: #c0392b;
            }
            /* Стилізація інтерактивної таблиці */
            .table-container {
                overflow-x: auto;
                width: 100%;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 10px;
                text-align: left;
            }
            th,
            td {
                padding: 12px 15px;
                border-bottom: 1px solid #e1e8ed;
                font-size: 15px;
            }
            th {
                background-color: #3498db;
                color: white;
                font-weight: 600;
            }
            tr:nth-child(even) {
                background-color: #f8f9fa;
            }
            tr {
                animation: fadeIn 0.3s ease;
                cursor: pointer; /* Змінюємо курсор, щоб показати інтерактивність рядків */
                transition:
                    background-color 0.15s,
                    color 0.15s;
            }

            /* Новий CSS-клас для виділеного (інверсованого) рядка */
            tr.selected {
                background-color: #2c3e50 !important; /* Темний інверсний фон */
                color: #ffffff !important; /* Білий текст */
            }
            tr.selected td {
                border-bottom-color: #34495e;
            }

            .empty-row {
                text-align: center;
                color: #7f8c8d;
                font-style: italic;
            }
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(-5px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>
    </head>
    <body>
        <div class="table-card">
            <h2>Реєстр тваринного світу</h2>

            <form id="animalForm" onsubmit="event.preventDefault()">
                <div class="inputs-grid">
                    <div class="form-group">
                        <label for="nameInp">Назва тварини:</label>
                        <input
                            type="text"
                            id="nameInp"
                            placeholder="напр. Тигр"
                        />
                    </div>
                    <div class="form-group">
                        <label for="classInp">Клас:</label>
                        <input
                            type="text"
                            id="classInp"
                            placeholder="напр. Ссавці"
                        />
                    </div>
                    <div class="form-group">
                        <label for="habitatInp">Середовище існування:</label>
                        <input
                            type="text"
                            id="habitatInp"
                            placeholder="напр. Азіатські ліси"
                        />
                    </div>
                    <div class="form-group">
                        <label for="lifespanInp">Вік (років):</label>
                        <input
                            type="number"
                            id="lifespanInp"
                            min="1"
                            placeholder="напр. 15"
                        />
                    </div>
                    <div class="form-group">
                        <label for="statusInp">Статус охорони:</label>
                        <input
                            type="text"
                            id="statusInp"
                            placeholder="напр. Вимираючий"
                        />
                    </div>
                </div>

                <div class="btn-container">
                    <button type="button" id="addBtn" class="btn btn-add">
                        Додати запис
                    </button>
                    <button type="button" id="removeBtn" class="btn btn-remove">
                        Видалити рядок
                    </button>
                </div>
            </form>

            <div class="table-container">
                <table id="animalsTable">
                    <thead>
                        <tr>
                            <th>Назва тварини</th>
                            <th>Клас</th>
                            <th>Середовище існування</th>
                            <th>Тривалість життя</th>
                            <th>Статус охорони</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr id="emptyPlaceholder">
                            <td colspan="5" class="empty-row">
                                Таблиця порожня. Додайте першу тварину.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                // Отримання посилань на елементи полів введення
                const nameInp = document.getElementById("nameInp");
                const classInp = document.getElementById("classInp");
                const habitatInp = document.getElementById("habitatInp");
                const lifespanInp = document.getElementById("lifespanInp");
                const statusInp = document.getElementById("statusInp");

                // Посилання на кнопки та тіло таблиці
                const addBtn = document.getElementById("addBtn");
                const removeBtn = document.getElementById("removeBtn");
                const tableBody = document.getElementById("tableBody");

                // Зберігаємо початковий рядок-заглушку в пам'яті, щоб відновлювати за потреби
                let placeholder = document.getElementById("emptyPlaceholder");

                // 1. Скрипт для кнопки "Додати"
                addBtn.addEventListener("click", function () {
                    const name = nameInp.value.trim();
                    const animalClass = classInp.value.trim();
                    const habitat = habitatInp.value.trim();
                    const lifespan = lifespanInp.value.trim();
                    const status = statusInp.value.trim();

                    if (
                        name !== "" &&
                        animalClass !== "" &&
                        habitat !== "" &&
                        lifespan !== "" &&
                        status !== ""
                    ) {
                        // Якщо заглушка досі є в таблиці — видаляємо її
                        if (document.getElementById("emptyPlaceholder")) {
                            placeholder.remove();
                        }

                        // Створюємо новий рядок таблиці <tr>
                        const newRow = document.createElement("tr");

                        const rowData = [
                            name,
                            animalClass,
                            habitat,
                            lifespan + " років",
                            status,
                        ];

                        // Наповнюємо рядок комірками <td>
                        for (let i = 0; i < rowData.length; i++) {
                            const newCell = document.createElement("td");
                            newCell.textContent = rowData[i];
                            newRow.appendChild(newCell);
                        }

                        // --- НОВА МОДИФІКАЦІЯ: додаємо подію кліку для виділення рядка ---
                        newRow.addEventListener("click", function () {
                            // Метод toggle додає клас, якщо його немає, або видаляє, якщо він є
                            this.classList.toggle("selected");
                        });
                        // -----------------------------------------------------------------

                        // Додаємо сформований рядок в кінець таблиці
                        tableBody.appendChild(newRow);

                        // Очищаємо всі поля після введення
                        nameInp.value = "";
                        classInp.value = "";
                        habitatInp.value = "";
                        lifespanInp.value = "";
                        statusInp.value = "";

                        nameInp.focus();
                    } else {
                        alert(
                            "Помилка: Заповніть усі 5 полів введення параметрів тварини!",
                        );
                    }
                });

                // 2. Скрипт для кнопки "Видалити" (Тепер видаляє лише ВИДІЛЕНІ рядки)
                removeBtn.addEventListener("click", function () {
                    // Знаходимо всі рядки, які мають доданий клас .selected
                    const selectedRows =
                        tableBody.querySelectorAll("tr.selected");

                    // Перевіряємо, чи користувач виділив хоча б один рядок
                    if (selectedRows.length > 0) {
                        // Проходимося циклом по всіх знайдених виділених рядках
                        selectedRows.forEach(function (row) {
                            // Видаляємо поточний рядок з тіла таблиці
                            tableBody.removeChild(row);
                        });

                        // Якщо після видалення таблиця спорожніла — повертаємо заглушку
                        if (tableBody.children.length === 0) {
                            tableBody.appendChild(placeholder);
                        }
                    } else {
                        // Якщо таблиця взагалі порожня
                        if (document.getElementById("emptyPlaceholder")) {
                            alert(
                                "У таблиці немає даних про тварин для видалення!",
                            );
                        } else {
                            // Якщо дані є, але нічого не клікнули
                            alert(
                                "Будь ласка, спочатку виділіть рядок (або кілька), клацнувши на нього мишкою!",
                            );
                        }
                    }
                });
            });
        </script>
    </body>
</html>
