<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
        body {
            justify-content: center;
            align-items: center;
            background-color: white;
            font-family: sans-serif;
        }

        .but1 {
            background-color: #86f77e;
            color:#f77e7e;
            border-radius: 5px;
            box-shadow: 4px 3px #c4c4c2;

            transition-property: background-color, color, box-shadow;
            transition-duration: 0.5s;
            transition-timing-function: ease;
            transition-delay: 0s;
        }
        .but2 {
             background-color: #f77e7e;
             color:#86f77e;
             border-radius: 5px;
             box-shadow: 4px 3px #c4c4c2;

             transition-property: background-color, color, box-shadow;
             transition-duration: 0.5s;
             transition-timing-function: ease;
             transition-delay: 0s;
        }

        .textarea {
            background-color: #f5ef7d;
            box-shadow: 4px 3px #c4c4c2;

            transition-property: background-color, color, box-shadow;
            transition-duration: 0.4s;
            transition-timing-function: linear;
            transition-delay: 0s;
        }
        label {
            color:  #9027f2;
            font-family: open sans;
        }
        input {
            color: #9027f2;

            transition-property: background-color, color, box-shadow;
            transition-duration: 0.4s;
            transition-timing-function: ease-in-out;
            transition-delay: 0s;
        }
        textarea {
            background-color: #f5ef7d;
            color: #9027f2;
            box-shadow: 4px 3px #c4c4c2;

            transition-property: background-color, color, box-shadow;
            transition-duration: 0.4s;
            transition-timing-function: ease-in-out;
            transition-delay: 0s;
        }
        legend {
            color: #a2fa5f;
        }
        button {
            font-family: open sans;
        }
        button.but1:hover {
            background-color:#f77e7e;
            color:#86f77e;
            box-shadow: 4px 3px #40753c;
        }
        button.but2:hover {
            background-color:#86f77e;
            color:#f77e7e;
            box-shadow: 4px 3px #5e0909;
        }
        textarea:focus{
            color: #f5ef7d;
            background-color:#9027f2;
            box-shadow: 4px 3px #bb7df5;
            outline: none;
        }
        input:focus{
            color: #f5ef7d;
            background-color:#9027f2;
            box-shadow: 4px 3px #bb7df5;
            outline: none;
        }


        .dynamic-report-container {
            margin: 40px auto;
            padding: 20px;
            border: 3px dashed #9027f2;
            background-color: #fdfbfa;
            border-radius: 8px;
            max-width: 600px;
            font-family: sans-serif;
            box-shadow: 4px 4px 10px #c4c4c2;
        }
        .dynamic-report-container h2 {
            color: #9027f2;
            border-bottom: 2px solid #86f77e;
            padding-bottom: 8px;
            margin-top: 0;
        }
        .report-line {
            margin: 12px 0;
            font-size: 16px;
            color: #333;
        }
        .report-line strong {
            color: #9027f2;
        }
        </style>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    </head>
    <body>
        <form name="forma1">
            <label>Введіть пароль</label>
            <input type="password" class="textarea" maxlength="50" />
            <br></br>
            <table width="100%" height="100%">
              <tr>
                <td align="center" valign="middle">
            <fieldset>
                <legend><label>Розкажіть про себе</label></legend>
                <label>
                    Ваше імʼя:
                    <input
                        type="name"
                        class="textarea"
                        maxlength="50"
                    />
                </label>
                <br></br>
                <label for="age">Ваш вік:</label>
                <select name="age" id="age">
                    <option value="18-24">18-24</option>
                    <option value="25-34">25-34</option>
                    <option value="35-44">35-44</option>
                    <option value="45-54">45-54</option>
                    <option value="55+">55+</option>
                </select>
                <br></br>
                <label for="sex">Ваша стать:</label>
                <input type="radio" name="sex" value="man">
                <label for="sex">Чоловіча</label>
                <input type="radio" name="sex" value="man">
                <label for="sex">Жіноча</label>
                <br></br>
                <label for="intrst">Ваші інтереси:<br></label>
                <input type="checkbox" name="intrst1" value="computers"></input>
                <label for="intrst1">Компʼютери</label>
                <input type="checkbox" name="intrst1" value="sport"></input>
                <label for="intrst1">Спорт</label>
                <input type="checkbox" name="intrst1" value="art"></input>
                <label for="intrst1">Мистецтво</label>
                <input type="checkbox" name="intrst1" value="science"></input>
                <label for="intrst1">Наука</label>
            </fieldset>
            <fieldset>
                <legend><label>Ваша думка</label></legend>
                <label for="intrst">Введіть імʼя файла з описом вашої думки:<br></label>
                <input type="name" class="textarea" maxlength="50" />
                <button type="submit" class="but1" value="Огляд..."><i class="fa-solid fa-magnifying-glass"></i>Огляд</button>
                <br></br>
                <label for="intrst">Або можете висловити свою думку прямо тут:<br></label>
                <article>
                <textarea cols="35" rows="5" wraps="virtual" class="textarea"></textarea>
                </article>
                <br></br>
                <button type="submit" class="but1" value="Відпарвити"><i class="fa-solid fa-paper-plane"></i>Відправити</button>
                <button type="reset" class="but2" value="Очистити форму"><i class="fa-solid fa-ban"></i>Очистити</button>
                </fieldset>
                </td>
                 </tr>
               </table>
        </form>


        <script>
            document.addEventListener("DOMContentLoaded", function() {

                const form = document.forms['forma1'];


                const submitButtons = document.getElementsByClassName("but1");
                const sendBtn = submitButtons[1];

                if (sendBtn) {
                    sendBtn.addEventListener("click", function(event) {

                        event.preventDefault();




                        const ageSelect = document.getElementById("age");
                        const ageValue = ageSelect ? ageSelect.value : "Не вказано";



                        const textInputs = document.getElementsByClassName("textarea");
                        const passwordValue = textInputs[0] ? textInputs[0].value : "";
                        const nameValue = textInputs[1] && textInputs[1].value.trim() !== "" ? textInputs[1].value : "Анонім";
                        const fileValue = textInputs[2] && textInputs[2].value.trim() !== "" ? textInputs[2].value : "Не вказано";


                        const sexRadios = document.getElementsByName("sex");
                        let sexValue = "Не обрано";

                        if (sexRadios[0] && sexRadios[0].checked) sexValue = "Чоловіча";
                        if (sexRadios[1] && sexRadios[1].checked) sexValue = "Жіноча";


                        const interestCheckboxes = document.getElementsByName("intrst1");
                        let selectedInterests = [];
                        const interestLabels = ["Комп'ютери", "Спорт", "Мистецтво", "Наука"];
                        for (let i = 0; i < interestCheckboxes.length; i++) {
                            if (interestCheckboxes[i].checked) {
                                selectedInterests.push(interestLabels[i]);
                            }
                        }
                        const interestsResult = selectedInterests.length > 0 ? selectedInterests.join(", ") : "Не обрано жодного";


                        const textareas = document.getElementsByTagName("textarea");
                        const opinionValue = textareas[0] && textareas[0].value.trim() !== "" ? textareas[0].value : "Думка відсутня";


                        const formElement = document.querySelector("form[name='forma1']");



                        let reportBlock = document.getElementById("final-report-block");
                        if (!reportBlock) {
                            reportBlock = document.createElement("div");
                            reportBlock.id = "final-report-block";
                            reportBlock.className = "dynamic-report-container";
                            document.body.appendChild(reportBlock);
                        }


                        reportBlock.innerHTML = `
                            <h2><i class="fa-solid fa-file-lines"></i> Розгорнутий звіт за даними форми</h2>
                            <div class="report-line"><strong>Ваше ім'я:</strong> ${nameValue}</div>
                            <div class="report-line"><strong>Довжина паролю:</strong> ${passwordValue.length} символів</div>
                            <div class="report-line"><strong>Ваш вік:</strong> ${ageValue}</div>
                            <div class="report-line"><strong>Ваша стать:</strong> ${sexValue}</div>
                            <div class="report-line"><strong>Інтереси:</strong> ${interestsResult}</div>
                            <div class="report-line"><strong>Файл опису:</strong> ${fileValue}</div>
                            <div class="report-line"><strong>Текст думки:</strong> <br><em>${opinionValue}</em></div>
                        `;


                        reportBlock.scrollIntoView({ behavior: 'smooth' });
                    });
                }


                form.addEventListener("reset", function() {
                    const reportBlock = document.getElementById("final-report-block");
                    if (reportBlock) {
                        reportBlock.remove();
                    }
                });
            });
        </script>
    </body>
</html>
