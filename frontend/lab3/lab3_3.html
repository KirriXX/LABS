<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <table>
            <form name="interests">
                <tr>
                    <td colspan="2" align="center">
                        Виберіть ваші інтереси:<br />
                    </td>
                </tr>
                <tr>
                    <td>Спорт</td>
                    <td>
                        <input type="checkbox" name="ints1" value="sport" />
                    </td>
                </tr>
                <tr>
                    <td>Мандрівки</td>
                    <td>
                        <input type="checkbox" name="ints2" value="travel" />
                    </td>
                </tr>
                <tr>
                    <td align="center">Майстрування</td>
                    <td>
                        <input type="checkbox" name="ints3" value="diy" />
                    </td>
                </tr>
                <tr>
                    <td align="right">Малювання</td>
                    <td>
                        <input type="checkbox" name="ints4" value="draw" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="submit" name="submit" value="Вибрати" />
                        <input type="reset" value="Відмовитися" />
                    </td>
                </tr>
            </form>
        </table>
    </body>
</html>
