<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <title>Накладання блоків (z-index)</title>
        <style>
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                background-color: white;
                font-family: sans-serif;
            }

            /* Контейнер менший за сумарний розмір блоків, щоб вони накладалися */
            .canvas {
                position: relative;
                width: 300px;
                height: 300px;
                background: white;
                border: 1px solid #ddd;
            }

            .block {
                position: absolute;
                width: 120px; /* Достатній розмір для напуску */
                height: 120px;
                display: flex;
                align-items: center;
                justify-content: center;
                border: 2px solid #000;
                font-weight: bold;
                opacity: 0.95; /* Легка прозорість, щоб було видно накладання */
            }

            /* Кутові блоки */
            .b1 {
                top: 0;
                left: 0;
                background-color: #ffadad;
                color: #900;
                z-index: 1;
            }

            .b5 {
                top: 0;
                right: 0;
                background-color: #ffd6a5;
                color: #960;
                z-index: 1;
            }

            .b2 {
                bottom: 0;
                left: 0;
                background-color: #caffbf;
                color: #060;
                z-index: 1;
            }

            .b4 {
                bottom: 0;
                right: 0;
                background-color: #9bf6ff;
                color: #069;
                z-index: 1;
            }

            /* Центральний блок, що накладається зверху на всі інші */
            .b3 {
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 130px;
                height: 130px;
                background-color: #bdb2ff; /* Бузковий */
                color: #303;
                z-index: 1; /* Найвищий пріоритет — він "над" усіма іншими */
            }
        </style>
    </head>
    <body>
        <div class="canvas">
            <div class="block b3">Блок 3</div>
            <div class="block b1">Блок 1</div>
            <div class="block b5">Блок 5</div>
            <div class="block b2">Блок 2</div>
            <div class="block b4">Блок 4</div>
        </div>
    </body>
</html>
