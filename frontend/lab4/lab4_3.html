<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Таблиця</title>
        <style>
            table {
                border-collapse: collapse;
                border: 1px solid #ccc;
                width: 80%;
                margin: 30px auto;
                font-family: Arial, sans-serif;
                background-color: white;
            }
            td {
                height: 40px;
                width: 25%;
                border: 1px solid #ccc;
            }
            .highlight {
                        background-color: #a9a9a9;
                        border: 4px dashed #00bfff;
        </style>
    </head>
    <body>
        <table>
            <tr>
                <td class="highlight"></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td></td>
                <td class="highlight"></td>
                <td class="highlight"></td>
                <td></td>
            </tr>
            <tr>
                <td></td>
                <td class="highlight"></td>
                <td class="highlight"></td>
                <td></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td></td>
                <td class="highlight"></td>
            </tr>
        </table>
    </body>
</html>
