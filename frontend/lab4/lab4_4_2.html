<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Макет сторінки</title>
        <style>
            table {
                width: 100%;
                height: 100vh;
                border-collapse: collapse;
            }
            td {
                padding: 20px;
                font-weight: medium;
                font-size: 24px;
                vertical-align: top;
                text-align: left;
            }
            .nav {
                background-color: yellow;
                color: brown;
                width: 30%;
            }
            .header {
                background-color: #e91e63;
                color: #ffeb3b;
                height: 80px;
            }
            .content {
                background-color: #2196f3;
                color: white;
            }
            .footer {
                background-color: #9c27b0;
                color: yellow;
                height: 60px;
            }
        </style>
    </head>
    <body>
        <table>
            <tr>
                <td class="nav" rowspan="3">Nav</td>
                <td class="header">Header</td>
            </tr>
            <tr>
                <td class="content">Content</td>
            </tr>
            <tr>
                <td class="footer">Footer</td>
            </tr>
        </table>
    </body>
</html>
