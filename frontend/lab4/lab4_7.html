<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            /* Стилізація сторінки для центрування */
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                font-family: Arial, sans-serif;
            }

            /* Основний блок з градієнтом */
            .gradient-box {
                width: 400px;
                height: 250px;
                border-radius: 15px;
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);

                /* ПАРАМЕТРИ ВАРІАНТУ 7:
                 Тип: Лінійний
                 Напрямок: Правий нижній кут (to bottom right)
                 Кольори: Жовтий, Сірий, Коричневий */
                background: linear-gradient(
                    to bottom right,
                    #ffe500,
                    #999999,
                    #4a2c00
                );

                /* Додатковий стиль для тексту всередині */
                display: flex;
                justify-content: center;
                align-items: center;
                color: white;
                font-size: 30px;
                font-weight: medium;
                border: 2px solid #555;
            }
        </style>
    </head>
    <body>
        <div class="gradient-box">Linear Gradient</div>
    </body>
</html>
