<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Адаптація тексту (Варіант 7)</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 40px;
                background-color: #f4f4f9;
            }
            .container {
                max-width: 600px;
                background: white;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            }
            textarea {
                width: 100%;
                height: 150px;
                padding: 10px;
                box-sizing: border-box;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-size: 16px;
                resize: vertical;
            }
            button {
                margin-top: 15px;
                padding: 10px 20px;
                font-size: 16px;
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                transition: background 0.2s;
            }
            button:hover {
                background-color: #0056b3;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h2>Адаптація тексту (Перші літери слів до ВЕРХНЬОГО регістру)</h2>

            <textarea
                id="textInput"
                placeholder="Введіть ваше речення сюди..."
            ></textarea>

            <br />

            <button onclick="adaptText()">Адаптувати</button>
        </div>

        <script>
            function adaptText() {
                // 1. Отримуємо елемент текстової області
                const textarea = document.getElementById("textInput");

                // 2. Отримуємо текст та очищаємо зайві пробіли на початку й у кінці за допомогою trim()
                let originalText = textarea.value.trim();

                if (originalText === "") {
                    alert("Будь ласка, введіть текст!");
                    return;
                }

                // 3. Розбиваємо текст на масив окремих слів за допомогою split()
                // Використовуємо регулярний вираз /\s+/, щоб коректно обробляти декілька пробілів підряд
                let words = originalText.split(/\s+/);

                // 4. Обробляємо кожне слово у циклі
                let adaptedWords = words.map((word) => {
                    if (word.length === 0) return word;

                    // Виділяємо перший символ за допомогою slice(0, 1) та переводимо в у верхній регістр за допомогою toUpperCase()
                    let firstLetter = word.slice(0, 1).toUpperCase();

                    // Беремо решту слова за допомогою slice(1)
                    let restOfWord = word.slice(1);

                    // З'єднуємо їх назад
                    return firstLetter + restOfWord;
                });

                // 5. Збираємо слова назад у рядок, розділяючи їх одним пробілом через join()
                let resultText = adaptedWords.join(" ");

                // 6. Замінюємо початковий текст в текстовій області на адаптований результат
                textarea.value = resultText;
            }
        </script>
    </body>
</html>
