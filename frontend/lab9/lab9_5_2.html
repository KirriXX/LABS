<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Мерехтіння тексту через setTimeout (Варіант 7)</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 40px;
                background-color: #f4f4f9;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 80vh;
            }
            .blinking-block {
                width: 400px;
                padding: 30px;
                background-color: white;
                border: 2px solid #ccc;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                font-size: 20px;
                font-weight: bold;
                text-align: center;
                line-height: 1.5;
                cursor: pointer;
                color: #333333; /* Початковий колір тексту */
                transition: color 0.3s ease;
            }
        </style>
    </head>
    <body>
        <div
            id="textBlock"
            class="blinking-block"
            onmouseover="startBlinking()"
            onmouseout="stopBlinking()"
        >
            Наведіть сюди курсор миші (мерехтіння кольору тексту через
            setTimeout, 1.5 сек)!
        </div>

        <script>
            // Змінна для зберігання ідентифікатора поточного таймера
            let blinkTimeoutId = null;

            function toggleColorLoop() {
                const block = document.getElementById("textBlock");

                // Перемикаємо колір тексту
                if (
                    block.style.color === "rgb(220, 53, 69)" ||
                    block.style.color === "red"
                ) {
                    block.style.color = "#333333"; // Звичайний темно-сірий
                } else {
                    block.style.color = "#dc3545"; // Яскраво-червоний
                }

                // РЕКУРСІЯ: Плануємо наступне перемикання кольору рівно через 1.5 секунди (1500 мс)
                blinkTimeoutId = setTimeout(toggleColorLoop, 1500);
            }

            function startBlinking() {
                // Перевіряємо, чи таймер не запущений, щоб уникнути багів при швидкому русі миші
                if (blinkTimeoutId === null) {
                    // Запускаємо перше перемикання
                    toggleColorLoop();
                }
            }

            function stopBlinking() {
                // Скасовуємо майбутній запланований запуск функції
                if (blinkTimeoutId !== null) {
                    clearTimeout(blinkTimeoutId);
                    blinkTimeoutId = null; // Скидаємо прапорець таймера
                }

                // Повертаємо початковий колір тексту
                const block = document.getElementById("textBlock");
                block.style.color = "#333333";
            }
        </script>
    </body>
</html>
