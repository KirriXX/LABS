<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <title>радіо-меню</title>
        <style>
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                justify-content: center;
                padding-top: 50px;
                background-color: #fffff;
            }

            .wrapper {
                display: flex;
                gap: 20px;
                align-items: flex-start;
            }

            input[type="radio"] {
                display: none;
            }

            .sidebar {
                display: flex;
                flex-direction: column;
                gap: 5px;
            }

            .sidebar label {
                display: block;
                width: 150px;
                padding: 15px;
                background-color: #f5f5f5;
                border: 1px solid #ddd;

                text-align: center;
                font-weight: bold;
            }

            .content-stack {
                position: relative;
                width: 400px;
                height: 250px;
            }

            .content-box {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                padding: 25px;
                background-color: white;
                border: 2px solid #333;
                box-sizing: border-box;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 20px;

                z-index: 1;
            }

            .item1 {
                border-left: 10px solid #e74c3c;
            }
            .item2 {
                border-left: 10px solid #3498db;
            }
            .item3 {
                border-left: 10px solid #2ecc71;
            }
            .item4 {
                border-left: 10px solid #f1c40f;
            }

            #tab1:checked ~ .sidebar label[for="tab1"] {
                background: #e74c3c;
                color: white;
                border-color: #e74c3c;
            }
            #tab2:checked ~ .sidebar label[for="tab2"] {
                background: #3498db;
                color: white;
                border-color: #3498db;
            }
            #tab3:checked ~ .sidebar label[for="tab3"] {
                background: #2ecc71;
                color: white;
                border-color: #2ecc71;
            }
            #tab4:checked ~ .sidebar label[for="tab4"] {
                background: #f1c40f;
                color: white;
                border-color: #f1c40f;
            }

            #tab1:checked ~ .content-stack .item1 {
                z-index: 10;
            }
            #tab2:checked ~ .content-stack .item2 {
                z-index: 10;
            }
            #tab3:checked ~ .content-stack .item3 {
                z-index: 10;
            }
            #tab4:checked ~ .content-stack .item4 {
                z-index: 10;
            }
        </style>
    </head>
    <body>
        <div class="wrapper">
            <input type="radio" name="tabs" id="tab1" checked />
            <input type="radio" name="tabs" id="tab2" />
            <input type="radio" name="tabs" id="tab3" />
            <input type="radio" name="tabs" id="tab4" />

            <nav class="sidebar">
                <label for="tab1">Розділ 1</label>
                <label for="tab2">Розділ 2</label>
                <label for="tab3">Розділ 3</label>
                <label for="tab4">Розділ 4</label>
            </nav>

            <main class="content-stack">
                <div class="content-box item1">Контент розділу 1</div>
                <div class="content-box item2">Контент розділу 2</div>
                <div class="content-box item3">Контент розділу 3</div>
                <div class="content-box item4">Контент розділу 4</div>
            </main>
        </div>
    </body>
</html>
